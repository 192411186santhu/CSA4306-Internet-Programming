<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Flight | SkyBook</title><link rel="stylesheet" href="../css/style.css"></head><body><header><h1>✈ SkyBook</h1><nav><a href="../index.html">Search Flights</a><a href="bookings.html">My Bookings</a></nav></header><main class="container"><section class="panel"><h2>Passenger and seat details</h2><div id="flightInfo"></div><h3>Choose a seat</h3><div id="seatGrid" class="seat-grid"></div><form id="bookingForm"><div class="field-grid"><label>Passenger name<input id="passenger" required></label><label>Email<input id="email" type="email" required></label><label>Phone number<input id="phone" type="tel" pattern="[0-9]{10}" placeholder="10-digit number" required></label><label>Travel date<input id="travelDate" type="date" required></label></div><p class="note">Payment is simulated for this lab demo. No real payment will be taken.</p><button class="primary" type="submit">Confirm Demo Booking</button></form><div id="confirmation"></div></section></main><footer>SkyBook · Demo reservation only</footer><script src="../js/book.js"></script></body></html>
